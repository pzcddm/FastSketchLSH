name: Build and Publish Wheels (TestPyPI)

on:
  workflow_dispatch:
    inputs:
      publish_testpypi:
        description: "Also publish artifacts to TestPyPI?"
        required: true
        default: "false"
  push:
    branches:
      - '**'
    tags-ignore:
      - '*'

jobs:
  build-wheels:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15-intel, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install cibuildwheel build

      - name: Copy root README into extension package
        run: cp README.md fastsketchlsh_ext/README.md

      - name: Build wheels via cibuildwheel
        working-directory: fastsketchlsh_ext
        env:
          CIBW_BUILD: "cp38-* cp39-* cp310-* cp311-* cp312-*"
          CIBW_SKIP: "*-musllinux*"
          CIBW_ARCHS_MACOS: "x86_64 arm64"
          CIBW_BEFORE_BUILD: "python -m pip install -U pip setuptools wheel numpy pybind11"
          CIBW_BEFORE_BUILD_MACOS: "brew update || true; brew install libomp || true"
          CIBW_ENVIRONMENT_MACOS: "MACOSX_DEPLOYMENT_TARGET=14.0"
          CIBW_BUILD_VERBOSITY: "1"
        run: |
          python -m cibuildwheel --output-dir dist

      - name: Build sdist (Linux only)
        if: matrix.os == 'ubuntu-latest'
        working-directory: fastsketchlsh_ext
        run: |
          python -m build --sdist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: |
            fastsketchlsh_ext/dist/*.whl
            fastsketchlsh_ext/dist/*.tar.gz
          if-no-files-found: ignore

  publish-testpypi:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.publish_testpypi == 'true'
    needs: build-wheels
    runs-on: ubuntu-latest
    steps:
      - name: Show branch/ref
        run: |
          echo "Ref: $GITHUB_REF"
          echo "SHA: $GITHUB_SHA"
      - name: Download all wheel artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          password: ${{ secrets.TEST_PYPI_API_TOKEN }}
          skip-existing: true
          packages-dir: dist


