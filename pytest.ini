[pytest]
# Keep default `pytest` runs focused on real unit tests.
# These three files are executable benchmark/demo scripts kept under `test/`
# for convenience, but importing them during collection can preload an older
# installed FastSketchLSH module and contaminate the test session.
addopts =
    --ignore=test/test_fast_sketch.py
    --ignore=test/test_accuracy.py
    --ignore=test/test_lsh_dedup_comparison.py
